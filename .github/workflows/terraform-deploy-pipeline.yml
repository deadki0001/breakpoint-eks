# ##############################################################################
# INFRASTRUCTURE PIPELINE - breakpoint-eks
#
# Same shape as the lsd-payments pipeline, pointed at environments/breakpoint and a
# separate state key so the two environments never touch each other's state.
#
# Backend state bucket lives in us-east-2 (created during the original
# lsd-payments bootstrap) - that is fixed regardless of which region the
# cluster itself deploys into. AWS_DEPLOY_REGION only controls where the
# actual AWS resources (VPC, EKS, nodes) get created.
#
# Triggers:
#   - Pull request to main: plan only, posts result as PR comment
#   - Push to main: plan then manual approval then apply
# ##############################################################################

name: BREAKPOINT-EKS Infrastructure Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'environments/breakpoint/**'
  push:
    branches: [main]
    paths:
      - 'environments/breakpoint/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  WORKING_DIR: environments/breakpoint
  BACKEND_REGION: us-east-2

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEPLOY_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=eks-demo-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=breakpoint/terraform.tfstate" \
            -backend-config="region=${{ env.BACKEND_REGION }}"

      - name: Terraform Validate
        run: terraform validate

  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.WORKING_DIR }}
          soft_fail: true

  cost-estimate:
    name: Infracost Estimate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost estimate
        run: |
          infracost breakdown --path=${{ env.WORKING_DIR }} \
            --format=table \
            --out-file=infracost_output.txt

      - name: Post cost estimate to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const fs = require('fs');
            const cost = fs.readFileSync('infracost_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Estimated Monthly Cost\n\`\`\`\n${cost}\n\`\`\``
            });

      - name: Save cost estimate artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: breakpoint-cost-estimate
          path: infracost_output.txt

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [iac-scan, cost-estimate]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEPLOY_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=eks-demo-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=breakpoint/terraform.tfstate" \
            -backend-config="region=${{ env.BACKEND_REGION }}"

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_grafana_cloud_api_token: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
        run: |
          terraform plan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... [truncated - see full output in Actions]'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## BREAKPOINT-EKS Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Save plan artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: breakpoint-terraform-plan
          path: ${{ env.WORKING_DIR }}/plan_output.txt

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [iac-scan, cost-estimate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production-infra
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEPLOY_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=eks-demo-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=breakpoint/terraform.tfstate" \
            -backend-config="region=${{ env.BACKEND_REGION }}"

      - name: Terraform Apply
        env:
          TF_VAR_grafana_cloud_api_token: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
        run: terraform apply -auto-approve