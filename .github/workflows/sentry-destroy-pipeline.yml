# ##############################################################################
# DESTROY PIPELINE - sentry-eks
#
# Run this at the end of every session. This cluster has no purpose sitting
# idle overnight - control plane plus 2x t3.medium plus a NAT gateway all
# bill by the hour whether you're using them or not.
#
# Backend state bucket lives in us-east-2, same as the deploy pipeline -
# that is fixed regardless of which region the cluster itself runs in.
#
# How to run:
#   GitHub repo -> Actions -> SENTRY-EKS Destroy Infrastructure -> Run workflow
# ##############################################################################

name: SENTRY-EKS Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm you want to delete the SENTRY-EKS cluster"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.7.5"
  WORKING_DIR: environments/sentry
  BACKEND_REGION: us-east-2

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: production-infra
    if: github.event.inputs.confirm == 'DESTROY'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.SENTRY_AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=eks-demo-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=sentry/terraform.tfstate" \
            -backend-config="region=${{ env.BACKEND_REGION }}"

      - name: Cleanup ALBs and target groups
        run: |
          REGION=${{ secrets.SENTRY_AWS_REGION }}
          ALB_ARNS=$(aws elbv2 describe-load-balancers --region $REGION \
            --query "LoadBalancers[?contains(LoadBalancerName, 'sentry')].LoadBalancerArn" \
            --output text)
          for ARN in $ALB_ARNS; do
            aws elbv2 delete-load-balancer --load-balancer-arn $ARN --region $REGION
          done
          [ -n "$ALB_ARNS" ] && sleep 30 || echo "No ALBs found"

          TG_ARNS=$(aws elbv2 describe-target-groups --region $REGION \
            --query "TargetGroups[?contains(TargetGroupName, 'sentry')].TargetGroupArn" \
            --output text)
          for ARN in $TG_ARNS; do
            aws elbv2 delete-target-group --target-group-arn $ARN --region $REGION
          done

      - name: Terraform Destroy
        env:
          TF_VAR_grafana_service_account_token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: terraform destroy -auto-approve