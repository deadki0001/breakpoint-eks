# breakpoint-cpu-pressure-rule.yaml
#
# NodeCPUPressure fires when node CPU usage exceeds 80%.
#
# rate() window is 1m - narrower windows (e.g. 30s) can return empty
# results if fewer than 2 scrape samples fall inside the window, since
# rate() needs at least 2 data points to compute a value. 1m reliably
# covers 2+ samples at this stack's default 30s scrape interval. A real
# production rule would use 5m to further smooth out brief spikes and
# avoid alert fatigue - this is tuned for fast, reliable demo reaction,
# not production use.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: breakpoint-cpu-pressure
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: breakpoint-cpu-pressure
      rules:
        - alert: NodeCPUPressure
          expr: |
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} CPU usage above 80%"
            description: "CPU usage on {{ $labels.instance }} has been above 80% (current value: {{ $value | printf \"%.1f\" }}%)."